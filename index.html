  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(18, 22, 36, 0.85);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #9d00ff;
      --text-main: #e0e6ed;
      --border-glow: rgba(0, 243, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(157, 0, 255, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.1), transparent 50%);
    }

    /* HEADER PORTAL */
    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1.portal-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    p.portal-subtitle {
      color: #8a99ad;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* CONTAINER CHÍNH */
    .portal-container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .portal-container {
        grid-template-columns: 1fr;
      }
    }

    /* ARCADE FRAME */
    .game-cabinet {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 243, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cabinet-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 5px;
    }

    .status-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* GAME IFRAME / CONTAINER */
    .game-screen-wrapper {
      width: 100%;
      max-width: 480px;
      height: 720px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(0, 243, 255, 0.2);
      position: relative;
      background: #000;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    iframe.game-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* SIDEBAR CONTROL */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      backdrop-filter: blur(10px);
    }

    .panel-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.1rem;
      color: var(--neon-cyan);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    /* VOCAB PRESETS */
    .vocab-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vocab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vocab-btn:hover {
      background: rgba(0, 243, 255, 0.1);
      border-color: var(--neon-cyan);
      transform: translateX(3px);
    }

    .vocab-tag {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 0, 127, 0.2);
      color: var(--neon-pink);
    }

    /* LEADERBOARD */
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 0.9rem;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .score-val {
      font-family: 'Chakra Petch', sans-serif;
      color: var(--neon-cyan);
      font-weight: bold;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.85rem;
      color: #627284;
    }
  </style>
</head>

<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: "Be Vietnam Pro", sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050508; color: #fff; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #0d101d 0%, #050508 100%); }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
    .interactive { pointer-events: auto; }
    .hud-top { display: flex; justify-content: space-between; align-items: center; width: 100%; font-family: "Chakra Petch", sans-serif; }
    .hud-card { background: rgba(15, 20, 35, 0.75); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; padding: 6px 12px; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0, 243, 255, 0.15); }
    .score-label { font-size: 0.75rem; color: #8a99ad; text-transform: uppercase; }
    .score-val { font-size: 1.2rem; font-weight: 700; color: #00f3ff; text-shadow: 0 0 8px rgba(0,243,255,0.6); }
    .life-val { font-size: 1.2rem; font-weight: 700; color: #ff007f; text-shadow: 0 0 8px rgba(255,0,127,0.6); }
    #menu-overlay { position: absolute; inset: 0; background: rgba(5, 5, 8, 0.88); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10; }
    .panel { background: rgba(15, 22, 40, 0.9); border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); display: flex; flex-direction: column; gap: 12px; }
    .panel-title { font-family: "Chakra Petch", sans-serif; text-align: center; font-size: 1.4rem; color: #00f3ff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-label { font-size: 0.75rem; color: #00f3ff; font-family: "Chakra Petch", sans-serif; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea, input[type="number"] { background: rgba(5, 10, 20, 0.8); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 6px; color: #fff; padding: 8px; font-size: 0.85rem; outline: none; transition: 0.2s; }
    input[type="text"]:focus, textarea:focus, input[type="number"]:focus { border-color: #00f3ff; box-shadow: 0 0 8px rgba(0,243,255,0.4); }
    textarea { resize: none; height: 70px; font-family: monospace; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { background: linear-gradient(135deg, #00f3ff, #ff007f); border: none; border-radius: 8px; color: #fff; padding: 10px; font-family: "Chakra Petch", sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); transition: 0.2s; text-align: center; }
    .btn:active { transform: scale(0.98); }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
    .toggle-label { font-size: 0.8rem; color: #d0d8e0; display: flex; align-items: center; gap: 6px; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #2a3545; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #00f3ff; }
    input:checked + .slider:before { transform: translateX(16px); }
    #virtual-keyboard { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 98%; max-width: 440px; background: rgba(10, 15, 28, 0.85); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 10px; padding: 6px; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
    .kb-row { display: flex; justify-content: center; gap: 3px; width: 100%; }
    .key { flex: 1; height: 36px; max-width: 38px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 4px; color: #fff; font-family: "Chakra Petch", sans-serif; font-size: 0.9rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.1s; }
    .key:active, .key.active { background: #00f3ff; color: #000; box-shadow: 0 0 10px #00f3ff; }
    .volume-slider { -webkit-appearance: none; width: 80px; height: 4px; border-radius: 2px; background: #2a3545; outline: none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #00f3ff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
      <div class="hud-top">
        <div class="hud-card"><div class="score-label">ĐIỂM</div><div id="score" class="score-val">0</div></div>
        <div class="hud-card" style="text-align: right;"><div class="score-label">MẠNG</div><div id="lives" class="life-val">❤️❤️❤️</div></div>
      </div>
      <div id="virtual-keyboard" class="interactive">
        <div class="kb-row" id="row1"></div>
        <div class="kb-row" id="row2"></div>
        <div class="kb-row" id="row3"></div>
      </div>
    </div>
    <div id="menu-overlay" class="interactive">
      <div class="panel">
        <div class="panel-title">SPACE TYPER DEFENDER</div>
        <div class="row-2">
          <div class="input-group">
            <label class="input-label">Tốc độ rơi</label>
            <input type="number" id="speedInput" value="0.05" step="0.01" min="0.0001">
          </div>
          <div class="input-group">
            <label class="input-label">Thời gian (s)</label>
            <input type="number" id="spawnInput" value="3.5" step="0.5" min="1">
          </div>
        </div>
        <div class="input-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="input-label">Danh sách từ vựng</label>
            <button id="aiGenBtn" style="background:none; border:none; color:#00f3ff; font-size:0.75rem; cursor:pointer;">✨ AI Tạo</button>
          </div>
          <textarea id="vocabInput" placeholder="Định dạng: Từ : Nghĩa&#10;GALAXY : Thiên hà"></textarea>
        </div>
        <button id="startBtn" class="btn">BẮT ĐẦU NHIỆM VỤ (ENTER)</button>
        <div class="toggle-row">
          <span class="toggle-label">🌐 Hiển thị phiên dịch</span>
          <label class="switch"><input type="checkbox" id="transToggle" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">🎵 Âm lượng nhạc <span id="volText">50%</span></span>
          <input type="range" id="bgmVol" class="volume-slider" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="toggle-row">
          <span class="toggle-label">🎯 Lối chơi đứng im (Tĩnh)</span>
          <label class="switch"><input type="checkbox" id="idleToggle" checked><span class="slider"></span></label>
        </div>
      </div>
    </div>
  </div>
  <script>
    const defaultVocab = [
      { word: "GALAXY", trans: "Thiên hà" }, { word: "PLANET", trans: "Hành tinh" },
      { word: "NEBULA", trans: "Tinh vân" }, { word: "ASTEROID", trans: "Tiểu hành tinh" },
      { word: "ORBIT", trans: "Quỹ đạo" }, { word: "COSMOS", trans: "Vũ trụ" },
      { word: "GRAVITY", trans: "Trọng lực" }, { word: "ROCKET", trans: "Tên lửa" }
    ];
    let vocabList = [...defaultVocab];
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let width, height;
    function resize() { width = canvas.width = canvas.parentElement.clientWidth; height = canvas.height = canvas.parentElement.clientHeight; }
    window.addEventListener("resize", resize); resize();

    let gameState = "MENU", score = 0, lives = 3;
    let activeWords = [], particles = [], lasers = [];
    let currentInput = "", targetWord = null;
    let baseSpeed = 0.05, spawnInterval = 3500, lastSpawn = 0;
    let showTranslation = true, isIdleMode = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmGain = audioCtx.createGain(); bgmGain.connect(audioCtx.destination); bgmGain.gain.value = 0.5;
    let isBgmPlaying = false, bgmTimer = null;

    function playSynthBgm() {
      if (isBgmPlaying) return; isBgmPlaying = true;
      const notes = [110, 130.81, 146.83, 164.81, 196.00]; let step = 0;
      bgmTimer = setInterval(() => {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = "sawtooth"; osc.frequency.setValueAtTime(notes[step % notes.length] / 2, audioCtx.currentTime);
        g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.connect(g); g.connect(bgmGain); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        step++;
      }, 200);
    }
    function stopSynthBgm() { isBgmPlaying = false; clearInterval(bgmTimer); }

    function playLaserSound() {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
      osc.type = "sawtooth"; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function speakWord(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.vx = (Math.random() - 0.5) * 6; this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1; this.size = Math.random() * 3 + 1;
      }
      update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.02; }
      draw() {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }

    function resolveMeteorOverlaps() {
      const minDistance = 80;
      for (let i = 0; i < activeWords.length; i++) {
        for (let j = i + 1; j < activeWords.length; j++) {
          let w1 = activeWords[i], w2 = activeWords[j];
          let dx = w2.x - w1.x, dy = w2.y - w1.y;
          let dist = Math.hypot(dx, dy);
          if (dist < minDistance && dist > 0) {
            let overlap = (minDistance - dist) / 2;
            let nx = dx / dist, ny = dy / dist;
            w1.x -= nx * overlap; w1.y -= ny * overlap;
            w2.x += nx * overlap; w2.y += ny * overlap;
            w1.x = Math.max(50, Math.min(width - 50, w1.x));
            w2.x = Math.max(50, Math.min(width - 50, w2.x));
          }
        }
      }
    }

    function spawnWord() {
      if (vocabList.length === 0 || activeWords.length >= 4) return;
      const item = vocabList[Math.floor(Math.random() * vocabList.length)];
      let bestX = width / 2, bestY = -20, maxMinDist = -1;
      for (let attempt = 0; attempt < 10; attempt++) {
        let testX = Math.random() * (width - 120) + 60;
        let testY = isIdleMode ? (Math.random() * (height * 0.4) + 80) : -20;
        let minDist = 9999;
        for (let w of activeWords) {
          let d = Math.hypot(w.x - testX, w.y - testY);
          if (d < minDist) minDist = d;
        }
        if (activeWords.length === 0 || minDist > maxMinDist) {
          maxMinDist = minDist; bestX = testX; bestY = testY;
        }
      }
      activeWords.push({
        text: item.word.toUpperCase(), trans: item.trans,
        x: bestX, y: bestY,
        speed: isIdleMode ? 0 : baseSpeed * (1 + Math.random() * 0.1),
        radius: 25, alpha: 0
      });
    }

    function destroyWord(index) {
      const w = activeWords[index];
      speakWord(w.text);
      for (let i = 0; i < 20; i++) particles.push(new Particle(w.x, w.y, "#00f3ff"));
      activeWords.splice(index, 1);
      score += 10; document.getElementById("score").innerText = score;
      if (targetWord === w) { targetWord = null; currentInput = ""; }
      spawnWord();
    }

    function startGame() {
      parseVocabInput();
      baseSpeed = parseFloat(document.getElementById("speedInput").value) || 0.05;
      spawnInterval = (parseFloat(document.getElementById("spawnInput").value) || 3.5) * 1000;
      showTranslation = document.getElementById("transToggle").checked;
      isIdleMode = document.getElementById("idleToggle").checked;
      score = 0; lives = 3; activeWords = []; particles = []; lasers = [];
      targetWord = null; currentInput = "";
      document.getElementById("score").innerText = score;
      document.getElementById("lives").innerText = "❤️❤️❤️";
      document.getElementById("menu-overlay").style.display = "none";
      gameState = "PLAYING"; playSynthBgm();
      spawnWord(); spawnWord();
    }

    function gameOver() {
      gameState = "GAMEOVER"; stopSynthBgm();
      alert("NHIỆM VỤ THẤT BẠI! Điểm của bạn: " + score);
      document.getElementById("menu-overlay").style.display = "flex";
    }

    function parseVocabInput() {
      const val = document.getElementById("vocabInput").value.trim();
      if (!val) { vocabList = [...defaultVocab]; return; }
      const lines = val.split("\n"); const parsed = [];
      lines.forEach(l => {
        const parts = l.split(":");
        if (parts.length >= 2) parsed.push({ word: parts[0].trim(), trans: parts[1].trim() });
      });
      if (parsed.length > 0) vocabList = parsed;
    }

    function handleInputChar(char) {
      if (gameState !== "PLAYING") return;
      if (!targetWord) {
        const match = activeWords.find(w => w.alpha >= 1 && w.text.startsWith(char));
        if (match) { targetWord = match; currentInput = char; playLaserSound(); lasers.push({ sx: width / 2, sy: height - 40, tx: match.x, ty: match.y, alpha: 1 }); }
      } else {
        const nextChar = targetWord.text[currentInput.length];
        if (char === nextChar) {
          currentInput += char; playLaserSound(); lasers.push({ sx: width / 2, sy: height - 40, tx: targetWord.x, ty: targetWord.y, alpha: 1 });
          if (currentInput === targetWord.text) { const idx = activeWords.indexOf(targetWord); if (idx !== -1) destroyWord(idx); }
        }
      }
    }

    window.addEventListener("keydown", (e) => {
      if (gameState === "MENU" && e.key === "Enter") { startGame(); return; }
      if (gameState === "PLAYING") {
        const key = e.key.toUpperCase();
        if (key.length === 1 && key >= "A" && key <= "Z") handleInputChar(key);
      }
    });

    const rows = [["Q","W","E","R","T","Y","U","I","O","P"], ["A","S","D","F","G","H","J","K","L"], ["Z","X","C","V","B","N","M"]];
    rows.forEach((r, idx) => {
      const container = document.getElementById("row" + (idx + 1));
      r.forEach(k => {
        const keyEl = document.createElement("div"); keyEl.className = "key"; keyEl.innerText = k;
        keyEl.addEventListener("touchstart", (e) => { e.preventDefault(); handleInputChar(k); keyEl.classList.add("active"); setTimeout(() => keyEl.classList.remove("active"), 100); });
        keyEl.addEventListener("mousedown", () => { handleInputChar(k); keyEl.classList.add("active"); setTimeout(() => keyEl.classList.remove("active"), 100); });
        container.appendChild(keyEl);
      });
    });

    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("bgmVol").addEventListener("input", (e) => { bgmGain.gain.value = parseFloat(e.target.value); document.getElementById("volText").innerText = Math.round(e.target.value * 100) + "%"; });
    document.getElementById("aiGenBtn").addEventListener("click", () => {
      const themes = [
        "SPACE : Vũ trụ\nSTAR : Ngôi sao\nGALAXY : Thiên hà\nCOMET : Sao chổi",
        "APPLE : Quả táo\nBANANA : Quả chuối\nORANGE : Quả cam\nGRAPE : Nho",
        "COMPUTER : Máy tính\nNETWORK : Mạng lưới\nDATA : Dữ liệu\nCODE : Mã nguồn"
      ];
      document.getElementById("vocabInput").value = themes[Math.floor(Math.random() * themes.length)];
    });

    function update() {
      if (gameState !== "PLAYING") return;
      const now = Date.now();
      if (now - lastSpawn > spawnInterval) { spawnWord(); lastSpawn = now; }

      resolveMeteorOverlaps();

      for (let i = activeWords.length - 1; i >= 0; i--) {
        const w = activeWords[i];
        if (w.alpha < 1) w.alpha = Math.min(1, w.alpha + 0.0012);
        w.y += w.speed;
        if (w.y > height - 60) {
          activeWords.splice(i, 1); lives--;
          document.getElementById("lives").innerText = "❤️".repeat(Math.max(0, lives));
          if (targetWord === w) { targetWord = null; currentInput = ""; }
          if (lives <= 0) gameOver();
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(); if (particles[i].alpha <= 0) particles.splice(i, 1); }
      for (let i = lasers.length - 1; i >= 0; i--) { lasers[i].alpha -= 0.1; if (lasers[i].alpha <= 0) lasers.splice(i, 1); }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.save(); ctx.strokeStyle = "rgba(0, 243, 255, 0.4)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(width / 2 - 20, height - 20); ctx.lineTo(width / 2, height - 40); ctx.lineTo(width / 2 + 20, height - 20); ctx.stroke(); ctx.restore();

      lasers.forEach(l => {
        ctx.save(); ctx.strokeStyle = `rgba(0, 243, 255, ${l.alpha})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(l.sx, l.sy); ctx.lineTo(l.tx, l.ty); ctx.stroke(); ctx.restore();
      });

      activeWords.forEach(w => {
        ctx.save(); ctx.globalAlpha = w.alpha;
        ctx.fillStyle = "rgba(20, 30, 50, 0.7)"; ctx.strokeStyle = (targetWord === w) ? "#ff007f" : "#00f3ff"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.font = "700 16px \"Chakra Petch\", sans-serif"; ctx.textAlign = "center";
        const isTarget = (targetWord === w);
        if (isTarget) {
          const typed = currentInput; const untyped = w.text.substring(typed.length);
          const tw = ctx.measureText(w.text).width; let startX = w.x - tw / 2;
          ctx.fillStyle = "#ff007f"; ctx.textAlign = "left"; ctx.fillText(typed, startX, w.y - 35);
          ctx.fillStyle = "#ffffff"; ctx.fillText(untyped, startX + ctx.measureText(typed).width, w.y - 35);
        } else {
          ctx.fillStyle = "#ffffff"; ctx.fillText(w.text, w.x, w.y - 35);
        }
        if (showTranslation && w.trans) {
          ctx.font = "12px \"Be Vietnam Pro\", sans-serif"; ctx.fillStyle = "#8a99ad"; ctx.fillText(w.trans, w.x, w.y + 40);
        }
        ctx.restore();
      });

      particles.forEach(p => p.draw());
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
